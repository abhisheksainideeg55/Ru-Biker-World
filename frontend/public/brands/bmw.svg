<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="100%" height="100%">
  <rect width="300" height="200" fill="#ffffff"/>
  <g transform="translate(150, 100)">
    <!-- BMW Propeller Roundel with 3D Chrome Edge -->
    <circle cx="0" cy="0" r="68" fill="#111111" stroke="#8E9297" stroke-width="4"/>
    <circle cx="0" cy="0" r="46" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
    <!-- Blue and White Quarters -->
    <path d="M0 -46 A46 46 0 0 1 46 0 L0 0 Z" fill="#0066B1"/>
    <path d="M0 0 L-46 0 A46 46 0 0 1 0 -46 Z" fill="#FFFFFF"/>
    <path d="M0 0 L0 46 A46 46 0 0 1 -46 0 Z" fill="#0066B1"/>
    <path d="M0 0 L46 0 A46 46 0 0 1 0 46 Z" fill="#FFFFFF"/>
    <!-- Letters B M W -->
    <text x="-36" y="-18" text-anchor="middle" fill="#FFFFFF" font-family="'Helvetica Neue', 'Arial Black', sans-serif" font-size="19" font-weight="900">B</text>
    <text x="0" y="-49" text-anchor="middle" fill="#FFFFFF" font-family="'Helvetica Neue', 'Arial Black', sans-serif" font-size="19" font-weight="900">M</text>
    <text x="36" y="-18" text-anchor="middle" fill="#FFFFFF" font-family="'Helvetica Neue', 'Arial Black', sans-serif" font-size="19" font-weight="900">W</text>
  </g>
</svg>
